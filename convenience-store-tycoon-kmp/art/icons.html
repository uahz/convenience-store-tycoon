<!doctype html>
<html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; }
body { background:#ffffff; font-family:"Microsoft YaHei UI",sans-serif; }
svg { display:block; }
</style></head><body>

<!-- ===== 主图标 512 ===== -->
<svg width="512" height="512" viewBox="0 0 512 512" id="icon-main">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F8A62"/><stop offset="1" stop-color="#0B4A36"/>
    </linearGradient>
    <linearGradient id="awning" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCEBE3"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <!-- 招牌横条 -->
  <rect x="112" y="118" width="288" height="42" rx="14" fill="#FFFFFF" opacity="0.95"/>
  <text x="256" y="150" text-anchor="middle" font-size="30" font-weight="700"
        fill="#0B4A36" font-family="Microsoft YaHei UI">便利店大亨</text>
  <!-- 店体 -->
  <rect x="140" y="212" width="232" height="180" rx="18" fill="#FFFFFF" opacity="0.96"/>
  <!-- 门 -->
  <rect x="232" y="292" width="48" height="100" rx="8" fill="#0B4A36"/>
  <!-- 橱窗 -->
  <rect x="164" y="292" width="48" height="56" rx="8" fill="#9CCDBB"/>
  <rect x="300" y="292" width="48" height="56" rx="8" fill="#9CCDBB"/>
  <!-- 遮阳棚：白绿相间扇贝 -->
  <rect x="120" y="164" width="272" height="52" rx="12" fill="url(#awning)"/>
  <g fill="#0B4A36">
    <path d="M120,216 a26,26 0 0 0 52,0 Z"/>
    <path d="M172,216 a26,26 0 0 0 52,0 Z"/>
    <path d="M224,216 a26,26 0 0 0 52,0 Z"/>
    <path d="M276,216 a26,26 0 0 0 52,0 Z"/>
    <path d="M328,216 a26,26 0 0 0 64,0 Z" transform="translate(-8,0)"/>
  </g>
  <!-- 金币 -->
  <circle cx="396" cy="366" r="46" fill="#E8A13D"/>
  <circle cx="396" cy="366" r="46" fill="none" stroke="#C9822B" stroke-width="6"/>
  <text x="396" y="382" text-anchor="middle" font-size="52" font-weight="800"
        fill="#0B4A36" font-family="Consolas">¥</text>
</svg>

<!-- ===== 游戏内小图标集（展示用） ===== -->
<svg width="1500" height="260" viewBox="0 0 1500 260" id="icons-sheet"
     style="background:#F2F5F3; border-radius:24px">
  <g fill="none" stroke="#157A54" stroke-width="14" stroke-linecap="round"
     stroke-linejoin="round">
    <!-- 1 店铺 -->
    <g transform="translate(60,50)">
      <path d="M10,50 L130,50 L130,60 Q100,78 70,60 Q40,78 10,60 Z" fill="#157A54" stroke="none"/>
      <rect x="18" y="70" width="104" height="60" rx="8" stroke="#157A54"/>
      <rect x="30" y="88" width="26" height="42" rx="4" stroke="#157A54"/>
      <rect x="86" y="88" width="26" height="30" rx="4" stroke="#157A54"/>
      <text x="70" y="164" text-anchor="middle" font-size="22" fill="#68788A"
            font-family="Microsoft YaHei UI" stroke="none">店铺</text>
    </g>
    <!-- 2 进货车 -->
    <g transform="translate(240,50)">
      <path d="M14,22 L38,22 L52,86 L118,86" stroke-width="14"/>
      <circle cx="62" cy="112" r="12" fill="#157A54" stroke="none"/>
      <circle cx="104" cy="112" r="12" fill="#157A54" stroke="none"/>
      <path d="M50,40 L118,40 L108,78 L58,78 Z" stroke-width="10"/>
      <text x="70" y="164" text-anchor="middle" font-size="22" fill="#68788A"
            font-family="Microsoft YaHei UI" stroke="none">进货</text>
    </g>
    <!-- 3 价签 -->
    <g transform="translate(420,50)">
      <path d="M70,14 L120,64 L74,122 L22,122 L22,64 Z" stroke-width="14"/>
      <circle cx="46" cy="46" r="9" fill="#157A54" stroke="none"/>
      <text x="70" y="164" text-anchor="middle" font-size="22" fill="#68788A"
            font-family="Microsoft YaHei UI" stroke="none">定价</text>
    </g>
    <!-- 4 货架/库存 -->
    <g transform="translate(600,50)">
      <rect x="14" y="20" width="112" height="96" rx="10" stroke-width="14"/>
      <line x1="14" y1="52" x2="126" y2="52" stroke-width="10"/>
      <line x1="14" y1="84" x2="126" y2="84" stroke-width="10"/>
      <rect x="30" y="30" width="22" height="16" fill="#E8A13D" stroke="none"/>
      <rect x="58" y="62" width="22" height="16" fill="#C7412F" stroke="none"/>
      <rect x="88" y="30" width="22" height="16" fill="#3A7BD5" stroke="none"/>
      <text x="70" y="164" text-anchor="middle" font-size="22" fill="#68788A"
            font-family="Microsoft YaHei UI" stroke="none">货架</text>
    </g>
    <!-- 5 趋势 -->
    <g transform="translate(780,50)">
      <path d="M14,110 L50,70 L84,92 L124,30" stroke-width="14"/>
      <path d="M96,28 L126,26 L122,56" stroke-width="12"/>
      <line x1="14" y1="130" x2="126" y2="130" stroke-width="8"/>
      <text x="70" y="164" text-anchor="middle" font-size="22" fill="#68788A"
            font-family="Microsoft YaHei UI" stroke="none">营收</text>
    </g>
    <!-- 6 金币 -->
    <g transform="translate(960,50)">
      <circle cx="70" cy="64" r="46" stroke-width="14"/>
      <text x="70" y="82" text-anchor="middle" font-size="48" font-weight="800"
            fill="#157A54" stroke="none" font-family="Consolas">¥</text>
      <text x="70" y="164" text-anchor="middle" font-size="22" fill="#68788A"
            font-family="Microsoft YaHei UI" stroke="none">现金</text>
    </g>
    <!-- 7 客流 -->
    <g transform="translate(1140,50)">
      <circle cx="48" cy="42" r="18" stroke-width="12"/>
      <path d="M20,116 Q20,74 48,74 Q76,74 76,116" stroke-width="12"/>
      <circle cx="98" cy="48" r="14" stroke-width="10"/>
      <path d="M78,116 Q78,84 98,84 Q122,84 122,112" stroke-width="10"/>
      <text x="70" y="164" text-anchor="middle" font-size="22" fill="#68788A"
            font-family="Microsoft YaHei UI" stroke="none">客流</text>
    </g>
    <!-- 8 警告 -->
    <g transform="translate(1320,50)">
      <path d="M70,18 L128,120 L12,120 Z" stroke-width="14"/>
      <line x1="70" y1="58" x2="70" y2="88" stroke-width="12"/>
      <circle cx="70" cy="104" r="7" fill="#157A54" stroke="none"/>
      <text x="70" y="164" text-anchor="middle" font-size="22" fill="#68788A"
            font-family="Microsoft YaHei UI" stroke="none">提醒</text>
    </g>
  </g>
</svg>

</body></html>
