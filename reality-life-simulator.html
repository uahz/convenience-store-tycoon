<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>现实人生模拟器</title>
<style>
/* ============ ANTI-DESIGN（反设计）风格层 ============ */
*{margin:0;padding:0;box-sizing:border-box;border-radius:0}
body{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:#FFFFFF;color:#000;min-height:100vh}
#app{max-width:1180px;margin:0 auto;padding:18px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3{font-weight:900}
button:focus-visible{outline:4px solid #0000FF;outline-offset:2px}
/* 按钮：粗黑边框 + 硬偏移阴影 + 生硬 hover */
.btn{background:#FF0000;color:#fff;border:4px solid #000;padding:10px 18px;font-size:15px;font-weight:900;text-transform:uppercase;box-shadow:4px 4px 0 #000;transition:all .1s linear}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #000;background:#FFFF00;color:#000}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:2px 2px 0 #000}
.btn.small{padding:6px 12px;font-size:13px}
/* 卡片：非对称粗边框 + 硬阴影 */
.card{background:#fff;border:5px solid #000;border-right-width:8px;border-bottom-width:8px;padding:16px;box-shadow:8px 8px 0 #000}
.card h3{font-size:16px;margin-bottom:10px;text-transform:uppercase}
.dim{color:#6B7280;font-size:12px;font-weight:700}
/* 标题页：黄色巨幅 + 旋转大标题 + 硬偏移文字阴影 */
.title-wrap{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;background:#FFFF00;border-bottom:8px solid #000}
.title-emoji{font-size:52px;letter-spacing:8px}
.title-wrap h1{font-size:clamp(44px,9vw,110px);margin:14px 0 8px;color:#000;letter-spacing:6px;transform:rotate(-2deg);text-shadow:6px 6px 0 #FF0000;line-height:1.1}
.title-wrap .sub{font-size:16px;color:#000;font-weight:900;margin-bottom:30px;transform:rotate(1deg)}
.title-wrap .btns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.title-wrap .hint{margin-top:26px;font-size:12px;color:#000;font-weight:700}
.float-e{position:absolute;font-size:32px;animation:fl 4s steps(8) infinite}
@keyframes fl{0%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-24px) rotate(4deg)}100%{transform:translateY(0) rotate(-5deg)}}
/* 创建页 */
.crate{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.crate .prev{position:sticky;top:18px;text-align:center}
.prev .avbox{background:#00FFFF;border:4px solid #000;padding:14px;margin-bottom:12px;box-shadow:6px 6px 0 #000;transform:rotate(-1deg)}
.sec{margin-bottom:18px}
.sec .lab{font-weight:900;font-size:14px;margin-bottom:8px;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:3px solid #000;background:#fff;padding:7px 14px;font-size:13.5px;font-weight:700;transition:all .1s linear}
.chip:hover{background:#FFFF00}
.chip.sel{background:#0000FF;color:#fff;font-weight:900;box-shadow:3px 3px 0 #000}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw b{width:30px;height:30px;border:3px solid #000;cursor:pointer;display:inline-block;transition:all .1s linear}
.sw b.sel{box-shadow:4px 4px 0 #FF0000;transform:translate(-2px,-2px)}
input[type=text]{border:4px solid #000;padding:9px 14px;font-size:15px;width:200px;font-family:inherit;color:#000;background:#fff;font-weight:700}
input[type=text]:focus{outline:none;border-color:#0000FF;box-shadow:4px 4px 0 #0000FF}
.talent{background:#FFFF00;border:4px solid #000;padding:10px 14px;margin-bottom:8px;box-shadow:4px 4px 0 #000;transform:rotate(-.5deg)}
.talent b{color:#000}
/* 游戏主界面 */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:14px}
.who{display:flex;align-items:center;gap:10px;min-width:190px}
.who .nm{font-weight:900;font-size:18px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(90px,1fr));gap:8px 14px;flex:1;min-width:320px}
.stat{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900}
.stat .lb{width:52px}
.bar{flex:1;height:14px;background:#fff;border:2px solid #000;overflow:hidden}
.bar i{display:block;height:100%;transition:none}
.apdots{display:flex;gap:5px;align-items:center;font-size:13px;font-weight:900}
.dot{width:14px;height:14px;border:2px solid #000;background:#fff;display:inline-block}
.dot.on{background:#FF0000}
.cols{display:grid;grid-template-columns:270px 1fr 300px;gap:16px;align-items:start}
@media(max-width:980px){.cols{grid-template-columns:1fr}.crate{grid-template-columns:1fr}}
.me-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tag{background:#00FFFF;color:#000;border:2px solid #000;padding:3px 9px;font-size:11.5px;font-weight:900;display:inline-block;transform:rotate(-1deg)}
.tag.mint{background:#FF00FF;transform:rotate(1deg)}
.kv{display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding:5px 0;border-bottom:2px solid #000}
.kv b{font-weight:900}
.moneytag{background:#000;color:#00FF00;padding:3px 10px;border:3px solid #000;font-weight:900;font-size:15px}
.fametag{background:#FFFF00;border:3px solid #000;padding:3px 10px;font-weight:900;font-size:14px}
.grid-actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:12px}
.act-btn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;background:#fff;border:4px solid #000;border-right-width:6px;border-bottom-width:6px;padding:10px 12px;text-align:left;font-weight:700;box-shadow:4px 4px 0 #000;transition:all .1s linear}
.act-btn:hover{background:#FFFF00;transform:translate(-2px,-2px);box-shadow:6px 6px 0 #FF0000}
.act-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.act-btn:disabled{opacity:.4;transform:none;box-shadow:2px 2px 0 #000;background:#fff}
.act-btn .ic{font-size:22px}
.act-btn .n{font-weight:900;font-size:14px}
.act-btn .d{font-size:11px;color:#6B7280;line-height:1.35;font-weight:700}
.navrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.rel-item{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:2px solid #000;font-size:13px;font-weight:700}
.rel-item .re{font-size:20px}
.rel-item .mini{flex:1;height:10px;background:#fff;border:2px solid #000;overflow:hidden}
.rel-item .mini i{display:block;height:100%;background:#FF0000}
.log{max-height:300px;overflow:auto}
.log-item{font-size:12.5px;padding:6px 4px;border-bottom:2px solid #000;line-height:1.5;font-weight:700}
.log-item .age{background:#000;color:#FFFF00;font-size:11px;margin-right:6px;padding:1px 5px;font-weight:900;display:inline-block;transform:rotate(-2deg)}
/* 弹窗：纯黑遮罩 + 白面板红硬阴影 */
.overlay{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border:6px solid #000;border-right-width:9px;border-bottom-width:9px;max-width:540px;width:100%;max-height:88vh;overflow:auto;padding:24px;box-shadow:12px 12px 0 #FF0000}
.modal .m-ic{font-size:42px}
.modal h3{font-size:20px;margin:8px 0 6px}
.modal .txt{font-size:14px;line-height:1.7;font-weight:700;margin-bottom:8px}
.choice{display:block;width:100%;text-align:left;background:#fff;border:4px solid #000;padding:12px 14px;margin-top:10px;font-size:14px;font-weight:700;transition:all .1s linear}
.choice:hover{background:#0000FF;color:#fff}
.choice:disabled{opacity:.4}
.choice small{display:block;color:#6B7280;font-size:11.5px;margin-top:2px;font-weight:700}
.choice:hover small{color:#fff}
/* 结算 */
.end-wrap{max-width:760px;margin:0 auto;padding:30px 10px;text-align:center}
.grade{width:130px;height:130px;border:6px solid #000;color:#fff;font-size:64px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:16px auto;box-shadow:10px 10px 0 #000;transform:rotate(-3deg)}
.kw{font-size:22px;font-weight:900;margin:6px 0;transform:rotate(-1deg)}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:18px 0}
.sumgrid .card{padding:12px}
.sumgrid .v{font-size:20px;font-weight:900;color:#0000FF}
.ach-chip{display:inline-block;background:#FFFF00;border:3px solid #000;color:#000;padding:4px 12px;font-size:12.5px;font-weight:900;margin:3px}
.tl-item{text-align:left;font-size:13px;padding:7px 10px;border-bottom:2px solid #000;font-weight:700}
.tl-item b{background:#FF0000;color:#fff;margin-right:8px;padding:1px 6px;display:inline-block;transform:rotate(-2deg)}
.chartbox{border:5px solid #000;border-right-width:8px;border-bottom-width:8px;box-shadow:8px 8px 0 #000;background:#fff;padding:10px;margin-top:14px;text-align:left}
.chartbox h3{margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#FF0000;color:#fff;border:4px solid #000;box-shadow:6px 6px 0 #000;padding:10px 22px;opacity:0;transition:all .1s linear;z-index:99;pointer-events:none;font-size:14px;font-weight:900}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmtM=n=>{n=Math.round(n);return Math.abs(n)>=10000?((n/10000).toFixed(1).replace('.0',''))+'万':'¥'+n};
let toastTimer=null;
function toast(m){const t=$('#toast');t.textContent=m;t.className='show';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='',1800);}

/* ================= 静态数据 ================= */
const SKINS=['#FFE3C9','#F5C99B','#E3AC78','#B97F58'];
const HAIRC=[{c:'#3A2A20',n:'深棕'},{c:'#6B4226',n:'栗色'},{c:'#B06F3C',n:'浅棕'},{c:'#E8C07D',n:'亚麻'}];
const OUTFITS=['#FF0000','#0000FF','#00FF00','#FF00FF','#00FFFF','#FFFF00'];
const HAIRSTYLES=[{id:'short',n:'清爽短发'},{id:'long',n:'柔顺长发'},{id:'bun',n:'俏皮丸子'},{id:'curly',n:'蓬蓬卷发'}];
const GENDERS=[{id:'m',n:'男孩'},{id:'f',n:'女孩'}];
const TRAITS=[
 {id:'sunny',n:'开朗',d:'心情更容易变好，社交更加分'},
 {id:'shy',n:'内向',d:'独处学习更专注（知识+），社交加成少'},
 {id:'dili',n:'勤奋',d:'学习成长 +30%'},
 {id:'opt',n:'乐观',d:'心态稳，坏消息影响小'},
 {id:'care',n:'细心',d:'考试更容易超常发挥'},
 {id:'adven',n:'冒险家',d:'机遇更多，偶尔翻车'},
 {id:'art',n:'艺术细胞',d:'魅力成长 +30%'},
 {id:'sport',n:'运动健将',d:'体能成长 +30%'}];
const TALENTS=[
 {id:'memory',n:'过目不忘',d:'知识成长 +60%'},
 {id:'strong',n:'天生活力',d:'体能成长 +60%'},
 {id:'pretty',n:'人气脸庞',d:'初始魅力高，社交更讨喜'},
 {id:'rich',n:'家境优渥',d:'家庭存款 +3万'},
 {id:'biz',n:'生意头脑',d:'理财收益更高'},
 {id:'lucky',n:'幸运星',d:'每年有几率收到意外小惊喜'},
 {id:'social',n:'社牛体质',d:'社交行动效果大幅提升'},
 {id:'night',n:'精力充沛',d:'每月行动点 +1'},
 {id:'kid',n:'玩家心态',d:'娱乐放松效果更好'},
 {id:'all',n:'全面发展',d:'所有成长 +15%'}];
const FAMILIES=[
 {n:'节俭家庭',d:'日子紧巴巴，但笑声不少',money:1000,mood:5},
 {n:'普通家庭',d:'爸妈工资稳定，温馨平常',money:8000},
 {n:'小康家庭',d:'吃穿不愁，偶尔全家旅行',money:30000},
 {n:'富裕家庭',d:'从小见世面，资源多多',money:90000,fame:10}];
const CAREERS=[
 {id:'code',icon:'💻',ladder:[{n:'初级程序员',pay:8000,req:{major:'cs'}},{n:'高级工程师',pay:15000,req:{smart:85,y:2}},{n:'技术总监',pay:28000,req:{smart:95,fame:55,y:5}}]},
 {id:'doctor',icon:'🩺',ladder:[{n:'住院医师',pay:9000,req:{major:'med'}},{n:'主治医师',pay:16000,req:{smart:88,y:3}},{n:'主任医师',pay:26000,req:{smart:95,fame:65,y:6}}]},
 {id:'teacher',icon:'📚',ladder:[{n:'人民教师',pay:6000,req:{major:'edu'}},{n:'资深教师',pay:10000,req:{smart:82,fame:45,y:3}},{n:'教导主任',pay:16000,req:{fame:60,y:6}}]},
 {id:'artist',icon:'🎨',ladder:[{n:'助理设计师',pay:5500,req:{major:'art'}},{n:'独立插画师',pay:12000,req:{fame:50,y:3}},{n:'知名艺术家',pay:25000,req:{fame:80,y:8}}]},
 {id:'coach',icon:'⚽',ladder:[{n:'健身教练',pay:5000,req:{fit:70}},{n:'明星私教',pay:10000,req:{fit:85,y:2}},{n:'门店经理',pay:18000,req:{charm:65,fame:50,y:5}}]},
 {id:'sales',icon:'💼',ladder:[{n:'销售专员',pay:5000,req:{charm:55}},{n:'销售经理',pay:10000,req:{charm:70,fame:45,y:3}},{n:'区域总监',pay:20000,req:{fame:65,y:6}}]},
 {id:'food',icon:'🍔',ladder:[{n:'餐饮服务员',pay:3500,req:{}},{n:'门店领班',pay:6000,req:{charm:45,y:1}},{n:'门店店长',pay:10000,req:{fame:40,y:3}},{n:'餐厅合伙人',pay:20000,req:{money:150000,fame:60,y:5}}]},
 {id:'barista',icon:'☕',ladder:[{n:'咖啡师',pay:4000,req:{charm:40}},{n:'首席咖啡师',pay:7000,req:{charm:60,y:2}},{n:'咖啡店店长',pay:12000,req:{fame:45,y:4}}]},
 {id:'courier',icon:'📦',ladder:[{n:'快递员',pay:4500,req:{fit:55}},{n:'快递站长',pay:7500,req:{fit:70,y:2}},{n:'网点经理',pay:12000,req:{fame:40,y:5}}]},
 {id:'basic',icon:'🏪',ladder:[{n:'便利店员',pay:3000,req:{}},{n:'仓储组长',pay:4500,req:{fit:60,y:1}},{n:'区域督导',pay:8000,req:{fame:35,y:4}}]}];
const MAJORS=[{id:'cs',n:'计算机'},{id:'med',n:'医学'},{id:'edu',n:'师范'},{id:'art',n:'美术'},{id:'biz',n:'商科'},{id:'pe',n:'体育'}];
const PARTTIME=[{n:'发传单',pay:400},{n:'餐厅小时工',pay:700},{n:'家教助理',pay:900,req:{smart:55}}];
const NPCNAMES=['小雨','阿哲','婷婷','大伟','小雅','阿凯','悦悦','子豪','小林','静静','老王','小美','阿杰','圆圆','大力','朵朵'];
const BABYNAMES=['豆豆','糖糖','小满','乐乐','团团','安安'];
const ACHV={job:{n:'初入职场',d:'找到第一份工作'},grad:{n:'学有所成',d:'大学毕业'},marry:{n:'佳偶天成',d:'步入婚姻'},baby:{n:'添丁之喜',d:'迎来宝宝'},house:{n:'安居乐业',d:'拥有自己的家'},rich50:{n:'小有积蓄',d:'总资产达50万'},rich200:{n:'财富自由',d:'总资产达200万'},fame:{n:'家喻户晓',d:'声望达到80'},zhuangyuan:{n:'金榜题名',d:'高考名列前茅'},health:{n:'健康之星',d:'70岁仍硬朗'},bond:{n:'情深意重',d:'家人感情深厚'}};

/* ================= 音效与配乐 ================= */
let AC=null;
function beep(f,d,t,v){if(!S||!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||0.05;o.connect(g);g.connect(AC.destination);const now=AC.currentTime;g.gain.setValueAtTime(g.gain.value,now);g.gain.exponentialRampToValueAtTime(0.001,now+d);o.start(now);o.stop(now+d);}catch(e){}}
const snd={click:()=>beep(660,0.07),good:()=>{beep(523,0.09);setTimeout(()=>beep(784,0.12),90);},bad:()=>{beep(330,0.12);setTimeout(()=>beep(262,0.16),110);},event:()=>beep(392,0.16,'triangle'),up:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.1),i*90));}};
/* 怀旧配乐：C 大调五声音阶旋律循环（温情略带怀旧），triangle 波形极低音量 */
let bgmTimer=null,bgmStep=0;
const BGM_SEQ=[[659,2],[784,2],[880,3],[784,2],[659,2],[523,2],[587,2],[659,4],[0,2],[523,2],[587,2],[659,2],[784,2],[880,2],[1047,4],[880,2],[784,2],[659,2],[587,2],[523,4],[0,2]];
function bgmTick(){if(!S||!S.sound||S.bgm===false)return;const n=BGM_SEQ[bgmStep%BGM_SEQ.length];bgmStep++;if(n[0])beep(n[0],0.4,'triangle',0.022);}
function startBgm(){if(bgmTimer||typeof setInterval==='undefined')return;bgmTimer=setInterval(bgmTick,440);}

/* ================= 头像 ================= */
function avatarSVG(p,size){
 const skin=SKINS[p.skin],hc=HAIRC[p.hairC].c,oc=OUTFITS[p.outfit];
 const mood=p.stats?p.stats.mood:70;
 let hair='';
 if(p.hair===0)hair='<path d="M22,46 Q24,15 50,15 Q76,15 78,46 Q70,28 50,28 Q30,28 22,46 Z" fill="'+hc+'"/>';
 else if(p.hair===1)hair='<path d="M22,46 Q24,15 50,15 Q76,15 78,46 Q70,28 50,28 Q30,28 22,46 Z" fill="'+hc+'"/><path d="M22,44 Q17,70 21,88 L32,86 Q28,66 30,48 Z" fill="'+hc+'"/><path d="M78,44 Q83,70 79,88 L68,86 Q72,66 70,48 Z" fill="'+hc+'"/>';
 else if(p.hair===2)hair='<circle cx="50" cy="12" r="9" fill="'+hc+'"/><path d="M22,46 Q24,15 50,15 Q76,15 78,46 Q70,28 50,28 Q30,28 22,46 Z" fill="'+hc+'"/>';
 else hair='<circle cx="34" cy="26" r="11" fill="'+hc+'"/><circle cx="50" cy="18" r="12" fill="'+hc+'"/><circle cx="66" cy="26" r="11" fill="'+hc+'"/><circle cx="26" cy="38" r="9" fill="'+hc+'"/><circle cx="74" cy="38" r="9" fill="'+hc+'"/>';
 let mouth;
 if(mood>=65)mouth='<path d="M42,57 Q50,65 58,57" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
 else if(mood>=35)mouth='<path d="M44,60 L56,60" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>';
 else mouth='<path d="M42,62 Q50,55 58,62" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
 return '<svg viewBox="0 0 100 112" width="'+size+'" height="'+Math.round(size*1.12)+'"><circle cx="50" cy="50" r="48" fill="#FFFF00" stroke="#000" stroke-width="3"/><rect x="28" y="80" width="44" height="34" fill="'+oc+'" stroke="#000" stroke-width="3"/><ellipse cx="50" cy="48" rx="26" ry="27" fill="'+skin+'" stroke="#000" stroke-width="2.5"/>'+hair+'<circle cx="41" cy="48" r="3" fill="#000"/><circle cx="59" cy="48" r="3" fill="#000"/><circle cx="34" cy="55" r="3.5" fill="#FF00FF" opacity="0.5"/><circle cx="66" cy="55" r="3.5" fill="#FF00FF" opacity="0.5"/>'+mouth+'</svg>';
}

/* ================= 状态与存档 ================= */
const KEY='lifeSimSave1';
let S=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function hasSave(){try{return !!localStorage.getItem(KEY);}catch(e){return false;}}
function loadSave(){try{const d=localStorage.getItem(KEY);if(!d)return false;S=JSON.parse(d);S.auto=false;if(S.bgm===undefined)S.bgm=true;if(S.over){render();return true;}S.screen='game';render();return true;}catch(e){return false;}}
function boot(){S={v:1,sound:true,bgm:true,screen:'title',over:false,auto:false,queue:[],cur:null,p:null,pop:null,popIdx:0};render();}

/* ================= 玩家助手 ================= */
function stageOf(a){return a<12?'child':a<18?'teen':a<60?'adult':'senior';}
function hasTr(p,id){return p.traits.includes(id);}
function hasTal(p,id){return p.talents.includes(id);}
function gm(p,k){let m=1;if(hasTal(p,'all'))m+=0.15;
 if(k==='smart'&&hasTal(p,'memory'))m+=0.6;
 if(k==='fit'&&hasTal(p,'strong'))m+=0.6;
 if(k==='charm'&&hasTal(p,'pretty'))m+=0.2;
 if(k==='smart'&&hasTr(p,'dili'))m+=0.3;
 if(k==='fit'&&hasTr(p,'sport'))m+=0.3;
 if(k==='charm'&&hasTr(p,'art'))m+=0.3;
 if(k==='smart'&&hasTr(p,'shy'))m+=0.15;
 return m;}
function stg(p,k,v){p.stats[k]=clamp(Math.round(p.stats[k]+v*gm(p,k)),0,100);}
function sst(p,k,v){p.stats[k]=clamp(p.stats[k]+v,0,100);}
function mny(p,v){p.money=Math.max(0,p.money+v);}
function fameV(p,v){p.fame=clamp(p.fame+v,0,100);}
function glog(p,ic,t){p.log.unshift({age:p.age,m:p.month,ic,t});if(p.log.length>140)p.log.pop();}
function tl(p,t){p.timeline.push({age:p.age,t});}
function ach(p,id){if(!p.ach.includes(id)){p.ach.push(id);glog(p,'🏆','解锁成就【'+ACHV[id].n+'】！');snd.up();}}
function assets(p){return p.money+p.bank+p.fund;}
function npcBy(p,part){return p.npcs.find(n=>n.name.indexOf(part)>=0);}
function bondN(p,part,v){const n=npcBy(p,part);if(n)n.bond=clamp(n.bond+v,0,100);}
function addNPC(p,o){if(!p.npcs.find(n=>n.name===o.name)){p.npcs.push(o);glog(p,o.ico,'你认识了新朋友：'+o.name+'。');}}
function uniqName(p){const used=p.npcs.map(n=>n.name);const pool=NPCNAMES.filter(n=>used.indexOf(n)<0);return pool.length?pick(pool):pick(NPCNAMES)+pick(['二世','小','阿']);}
function reqMet(p,req){return (!req.major||req.major===p.major)&&(!req.smart||p.stats.smart>=req.smart)&&(!req.fit||p.stats.fit>=req.fit)&&(!req.charm||p.stats.charm>=req.charm);}
function promoMet(p,n){const r=n.req;return (!r.smart||p.stats.smart>=r.smart)&&(!r.fit||p.stats.fit>=r.fit)&&(!r.charm||p.stats.charm>=r.charm)&&(!r.fame||p.fame>=r.fame)&&(!r.y||p.yearsLvl>=r.y)&&(!r.money||assets(p)>=r.money);}
function canJob(p){return !p.job&&!p.pension&&['社会','职校毕业','大学毕业'].includes(p.edu);}
function eligibleOffers(p){return CAREERS.filter(c=>reqMet(p,c.ladder[0].req));}
function careerOf(p){return p.job?CAREERS.find(c=>c.id===p.job):null;}

function doActionCore(id,auto){const p=S.p;const a=buildActions(p).find(x=>x.id===id);if(!a)return;const msg=a.fn();if(msg===null)return;p.ap=Math.max(0,p.ap-1);if(msg)glog(p,a.ic,(auto?'（自动）':'')+msg);}
function doAction(id){const p=S.p;if(p.ap<1){toast('本月行动点已用完，点【结束本月】吧');return;}doActionCore(id,false);snd.click();save();render();}

/* ================= 弹层：社交/理财/置业/求职 ================= */
function openPop(t){S.pop=t;S.popIdx=0;render();}
function closePop(){S.pop=null;render();}
function pickNPC(i){S.popIdx=i;render();}
function socAct(kind){const p=S.p;if(p.ap<1){toast('行动点不足');return;}const n=p.npcs[S.popIdx];if(!n)return;p.ap--;
 const bonus=(hasTr(p,'sunny')?2:0)+(hasTal(p,'social')?3:0)+(hasTal(p,'pretty')?1:0);
 if(kind==='chat'){n.bond=clamp(n.bond+3+bonus,0,100);sst(p,'mood',1);glog(p,'💬','和'+n.name+'聊了聊天，关系更近了。');snd.good();}
 if(kind==='play'){n.bond=clamp(n.bond+5+bonus,0,100);sst(p,'mood',2);if(p.age>=18)mny(p,-100);glog(p,'🎲','和'+n.name+'玩了一下午，笑声不断。');snd.good();}
 if(kind==='gift'){n.bond=clamp(n.bond+8+Math.floor(bonus/2),0,100);mny(p,-500);glog(p,'🎁','你给'+n.name+'挑了份礼物，TA开心极了。');snd.good();}
 if(kind==='love'){n.type='恋人';n.bond=78;tl(p,'和'+n.name+'在一起了');glog(p,'💗','你鼓起勇气表白，'+n.name+'红着脸答应了！');snd.up();}
 if(kind==='marry'){n.type='配偶';p.flags.married=true;mny(p,-20000);fameV(p,5);tl(p,'与'+n.name+'步入婚姻');ach(p,'marry');glog(p,'💍','在亲友的祝福中，你和'+n.name+'结婚了！');snd.up();}
 if(kind==='baby'){p.flags.child=true;addNPC(p,{name:pick(BABYNAMES),type:'子女',bond:90,ico:'👶'});sst(p,'mood',8);tl(p,'家里迎来了小宝宝');ach(p,'baby');glog(p,'👶','宝宝出生了，家里一下子热闹起来！');snd.up();}
 p.lastY[n.name]=p.age;closePop();save();}
function finOp(op){const p=S.p;
 if(op==='save'&&p.money>=10000){p.money-=10000;p.bank+=10000;glog(p,'🏦','存入银行 1 万元。');}
 if(op==='take'&&p.bank>=10000){p.bank-=10000;p.money+=10000;glog(p,'🏦','从银行取出 1 万元。');}
 if(op==='buy'&&p.money>=10000){p.money-=10000;p.fund+=10000;glog(p,'📈','买入 1 万元基金。');}
 if(op==='sell'&&p.fund>=10000){p.fund-=10000;p.money+=10000;glog(p,'📉','赎回 1 万元基金。');}
 snd.click();save();render();}
function houseBuy(i){const p=S.p;const o=[{n:'温馨小窝',price:600000,ico:'🏠'},{n:'宽敞大房',price:1200000,ico:'🏡'}][i];const as=assets(p);const need=Math.round(o.price*0.3);
 if(as<need){toast('首付需要 '+fmtM(need)+'，再攒攒吧');return;}
 let d=need;const um=Math.min(p.money,d);p.money-=um;d-=um;p.bank-=d;
 const loan=o.price-need;p.house={n:o.n,monthly:Math.round(loan/240),left:240};p.rent=null;
 sst(p,'mood',5);fameV(p,3);tl(p,'买下了'+o.n);ach(p,'house');glog(p,'🏡','首付 '+fmtM(need)+' 买下'+o.n+'，月供 '+fmtM(p.house.monthly)+'，日子有了着落！');snd.up();closePop();save();}
function setRent(r){const p=S.p;p.rent=r;const names={parents:'和父母同住',share:'搬去合租',solo:'独居公寓'};glog(p,'🔑','搬家了：'+names[r]+'。');snd.click();closePop();save();}
function takeJob(cid){const p=S.p;if(p.ap<1){toast('行动点不足');return;}const c=CAREERS.find(x=>x.id===cid);p.ap--;p.job=cid;p.jobLvl=0;p.yearsLvl=0;
 tl(p,'成为'+c.ladder[0].n);ach(p,'job');glog(p,'💼','你通过面试，成为一名'+c.ladder[0].n+'！月薪 '+fmtM(c.ladder[0].pay)+'。');snd.up();closePop();save();}

function weightedPick(pool){const tot=pool.reduce((s,e)=>s+(e.w||5),0);let r=Math.random()*tot;for(const e of pool){r-=(e.w||5);if(r<=0)return e;}return pool[0];}
function queueRandom(){const p=S.p;const pool=EVENTS.filter(e=>!e.when||e.when(p));if(pool.length)S.queue.push(weightedPick(pool));}

function checkAch(){const p=S.p;const as=assets(p);
 if(as>=500000)ach(p,'rich50');if(as>=2000000)ach(p,'rich200');if(p.fame>=80)ach(p,'fame');
 if(p.age>=70&&p.stats.health>=70)ach(p,'health');
 const fam=p.npcs.filter(n=>['家人','配偶','子女'].includes(n.type));
 if(fam.length&&fam.reduce((s,n)=>s+n.bond,0)/fam.length>=85)ach(p,'bond');}

 if(p.bank>0){const it=Math.round(p.bank*0.025);p.bank+=it;if(it>0)glog(p,'🏦','存款利息 +'+fmtM(it)+'。');}
 if(p.fund>0){let r=-0.12+Math.random()*0.40;if(hasTal(p,'biz'))r+=0.06;const ch=Math.round(p.fund*r);p.fund=Math.max(0,p.fund+ch);glog(p,ch>=0?'📈':'📉','基金'+(ch>=0?'上涨':'回调')+'，'+(ch>=0?'收益':'亏损')+' '+fmtM(Math.abs(ch))+'（现值 '+fmtM(p.fund)+'）。');}
 p.npcs.forEach(n=>{if(!['家人','配偶','子女','恋人'].includes(n.type)){if((p.lastY[n.name]||0)<p.age-1)n.bond=clamp(n.bond-3,0,100);}});
 if(p.age>=50){const d=Math.floor((p.age-45)/10);if(d>0){sst(p,'health',-d);glog(p,'🍂','岁月不饶人，健康略有下降（-'+d+'）。');}}
 if(p.stats.mood<30)sst(p,'health',-2);

 pushMilestones();
 if(Math.random()<0.7)queueRandom();

 p.curve=p.curve||[];p.curve.push({age:p.age,as:assets(p),mood:p.stats.mood});

function endMonth(){const p=S.p;if(S.over)return;
 let income=0;
 if(p.job){const c=careerOf(p);income+=Math.round(c.ladder[p.jobLvl].pay*(p.raise||1));}
 else if(p.pension)income+=p.pension;
 let exp=0;
 if(p.house){exp+=p.house.monthly;if(p.house.left>0)p.house.left--;}
 else if(p.rent==='share')exp+=1500;else if(p.rent==='solo')exp+=3000;
 if(p.age>=18){exp+=(p.rent==='parents')?300:1200;}
 p.money+=income-exp;
 if(p.money<0){if(p.bank+p.money>=0){p.bank+=p.money;p.money=0;glog(p,'💸','这个月入不敷出，动用了存款。');sst(p,'mood',-4);}else{p.money=0;p.bank=0;glog(p,'😰','收支吃紧，你靠打零工勉强撑了过去。');sst(p,'mood',-4);sst(p,'health',-1);}}
 else if(income-exp>0&&income>0)glog(p,'💰','本月结余 '+fmtM(income-exp)+'，钱包鼓了一点。');
 p.month++;
 p.ap=3+(hasTal(p,'night')?1:0);
 if(p.month>12){p.month=1;yearEnd();}
 else if(Math.random()<0.5)queueRandom();
 if(!S.over)save();
 pump();
}

function firstEligible(ev){for(let i=0;i<ev.cs.length;i++){if(!ev.cs[i].when||ev.cs[i].when(S.p))return i;}return 0;}
function pump(){if(!S)return;if(S.over){render();return;}
 while(S.auto&&S.queue.length){const ev=S.queue.shift();const i=firstEligible(ev);const msg=ev.cs[i].fn()||'';glog(S.p,ev.ic,'（自动）'+ev.t+'：'+msg);}
 if(S.cur){render();return;}
 if(S.queue.length){S.cur=S.queue.shift();snd.event();render();return;}
 render();}

 const avgBond=fam.length?Math.round(fam.reduce((s,n)=>s+n.bond,0)/fam.length):60;
 const as=assets(p);
 const wealth=Math.min(30,Math.floor(as/40000));
 const famePts=Math.round(p.fame*0.2);

 const total=Math.min(100,wealth+famePts+famPts+achPts+healthPts);
 const grade=total>=85?['S','传奇人生']:total>=65?['A','精彩人生']:total>=45?['B','充实人生']:['C','平凡而温暖'];
 const top=['smart','fit','charm'].sort((a,b)=>p.stats[b]-p.stats[a])[0];
 let kw=grade[1];

 else if(top==='smart')kw='学霸人生';else if(top==='fit')kw='活力人生';else if(top==='charm')kw='魅力人生';
 else if(p.flags.married&&p.flags.child)kw='幸福家庭';else if(!p.flags.married&&as>=500000)kw='独立人生';
 const kindTxt=kind==='health'?'身体亮起了红灯，你在亲友的陪伴中提前谢幕了。':kind==='age'?'在亲友的祝福中，你安详地走完了完整而丰盈的一生。':'你笑着和这个世界挥手：这一生，值得。';
 S.endData={grade:grade[0],gradeName:grade[1],kw,kindTxt,total,wealth,famePts,famPts,achPts,healthPts,as,avgBond,jobName:p.job?careerOf(p).ladder[p.jobLvl].n:(p.pension?'退休生活':'自由人生')};
 save();}

  +(canMarry?'<button class="choice" onclick="socAct(\'marry\')">💍 求婚<small>举办婚礼，花费 2 万</small></button>':'')
  +(canBaby?'<button class="choice" onclick="socAct(\'baby\')">👶 迎接新生命<small>家里添个小宝宝</small></button>':'')
  +'<button class="btn" style="margin-top:12px" onclick="closePop()">先不了</button></div></div>';}
 if(S.pop==='fin'){return '<div class="overlay" onclick="closePop()"><div class="modal" onclick="event.stopPropagation()"><div class="m-ic">💰</div><h3>理财规划</h3><div class="txt">现金 '+fmtM(p.money)+' · 存款 '+fmtM(p.bank)+'（年息2.5%）· 基金 '+fmtM(p.fund)+'（每年 -12%~+28% 波动'+(hasTal(p,'biz')?'，生意头脑加成中':'')+'）</div>'
  +'<button class="choice" onclick="finOp(\'save\')" '+(p.money<10000?'disabled':'')+'>🏦 存入 1 万</button>'
  +'<button class="choice" onclick="finOp(\'take\')" '+(p.bank<10000?'disabled':'')+'>🏦 取出 1 万</button>'
  +'<button class="choice" onclick="finOp(\'buy\')" '+(p.money<10000?'disabled':'')+'>📈 买入 1 万基金</button>'
  +'<button class="choice" onclick="finOp(\'sell\')" '+(p.fund<10000?'disabled':'')+'>📉 赎回 1 万基金</button>'
  +'<button class="btn" style="margin-top:12px" onclick="closePop()">搞定，收工</button></div></div>';}
 if(S.pop==='house'){const homes=[{n:'温馨小窝',price:600000,ico:'🏠'},{n:'宽敞大房',price:1200000,ico:'🏡'}];
  return '<div class="overlay" onclick="closePop()"><div class="modal" onclick="event.stopPropagation()"><div class="m-ic">🏠</div><h3>安家置业</h3><div class="txt">当前：'+(p.house?(p.house.n+'（月供'+fmtM(p.house.monthly)+'）'):{parents:'与父母同住',share:'合租（月租1500）',solo:'独居（月租3000）'}[p.rent])+' · 可用资金 '+fmtM(assets(p))+'</div>'
  +(p.house?'':homes.map((h,i)=>'<button class="choice" onclick="houseBuy('+i+')">'+h.ico+' 买下'+h.n+'（'+fmtM(h.price)+'，首付30%，月供'+fmtM(Math.round(h.price*0.7/240))+'）</button>').join(''))
  +'<button class="choice" onclick="setRent(\'share\')" '+(p.rent==='share'?'disabled':'')+'>🚪 搬去合租（月租 1500）</button>'
  +'<button class="choice" onclick="setRent(\'solo\')" '+(p.rent==='solo'?'disabled':'')+'>🏢 独居公寓（月租 3000）</button>'
  +'<button class="choice" onclick="setRent('+"'parents'"+')" '+(p.rent==='parents'?'disabled':'')+'>👨‍👩‍👧 回家和父母同住</button>'
  +'<button class="btn" style="margin-top:12px" onclick="closePop()">先看看再说</button></div></div>';}
 if(S.pop==='job'){const list=eligibleOffers(p).filter(c=>c.id!==p.job);
  return '<div class="overlay" onclick="closePop()"><div class="modal" onclick="event.stopPropagation()"><div class="m-ic">🔍</div><h3>寻找工作</h3><div class="txt">'+(list.length?'以下岗位与你匹配（消耗 1 行动点入职）：':'暂时没有匹配的岗位，先提升知识/体能/魅力，或先做做兼职。')+'</div>'
  +list.map(c=>'<button class="choice" onclick="takeJob(\''+c.id+'\')">'+c.icon+' '+c.ladder[0].n+'<small>月薪 '+fmtM(c.ladder[0].pay)+' · 晋升线：'+c.ladder.map(l=>l.n).join(' → ')+'</small></button>').join('')
  +'<button class="btn" style="margin-top:12px" onclick="closePop()">再想想</button></div></div>';}
 return '';}

/* ================= 数据可视化 ================= */
function radarSVG(p,size){
 const ks=[['health','健康'],['mood','心情'],['smart','知识'],['fit','体能'],['charm','魅力']];
 const cx=size/2,cy=size/2,r=size/2-56;
 const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/5;const rr=r*Math.max(0,Math.min(100,v||0))/100;return (cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1);};
 const vals=ks.map(k=>p&&p.stats?p.stats[k[0]]:0);
 const poly=ks.map((k,i)=>pt(i,vals[i])).join(' ');
 let grid='';[25,50,75,100].forEach(g=>{grid+='<polygon points="'+ks.map((k,i)=>pt(i,g)).join(' ')+'" fill="none" stroke="#000" stroke-width="'+(g===100?3:1.5)+'"/>';});
 let axes='';ks.forEach((k,i)=>{const a=-Math.PI/2+i*2*Math.PI/5;axes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+r*Math.cos(a)).toFixed(1)+'" y2="'+(cy+r*Math.sin(a)).toFixed(1)+'" stroke="#000" stroke-width="1.5"/>';});
 const labels=ks.map((k,i)=>{const a=-Math.PI/2+i*2*Math.PI/5;const lr=r+24;return '<text x="'+(cx+lr*Math.cos(a)).toFixed(1)+'" y="'+(cy+lr*Math.sin(a)).toFixed(1)+'" font-size="13" font-weight="900" text-anchor="middle" dominant-baseline="middle" fill="#000">'+k[1]+' '+vals[i]+'</text>';}).join('');
 return '<svg viewBox="0 0 '+size+' '+size+'" width="100%" style="max-width:'+size+'px" role="img" aria-label="属性雷达图"><rect x="0" y="0" width="'+size+'" height="'+size+'" fill="#FFFF00"/><polygon points="'+poly+'" fill="#FF0000" stroke="#000" stroke-width="3"/>'+grid+axes+labels+'</svg>';
}
function curveSVG(p,w,h){
 const c=(p&&p.curve)||[];if(c.length<2)return '<div class="dim">人生曲线数据不足。</div>';
 const maxA=Math.max(10000,...c.map(d=>d.as||0));
 const x0=46,x1=w-16,y0=26,y1=h-34;
 const X=i=>x0+(x1-x0)*i/(c.length-1);
 const YA=v=>y1-(y1-y0)*Math.min(1,(v||0)/maxA);
 const YM=v=>y1-(y1-y0)*Math.max(0,Math.min(100,v||0))/100;
 const la=c.map((d,i)=>X(i).toFixed(1)+','+YA(d.as).toFixed(1)).join(' ');
 const lm=c.map((d,i)=>X(i).toFixed(1)+','+YM(d.mood).toFixed(1)).join(' ');
 let ticks='';const step=Math.max(1,Math.round((c.length-1)/8));
 for(let i=0;i<c.length;i+=step){ticks+='<line x1="'+X(i).toFixed(1)+'" y1="'+y0+'" x2="'+X(i).toFixed(1)+'" y2="'+y1+'" stroke="#000" stroke-width="1"/><text x="'+X(i).toFixed(1)+'" y="'+(y1+16)+'" font-size="11" font-weight="900" text-anchor="middle" fill="#000">'+c[i].age+'岁</text>';}
 for(let g=0;g<=4;g++){const gy=y0+(y1-y0)*g/4;ticks+='<line x1="'+x0+'" y1="'+gy.toFixed(1)+'" x2="'+x1+'" y2="'+gy.toFixed(1)+'" stroke="#000" stroke-width="1"/>';}
 return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img" aria-label="人生曲线图" style="display:block;background:#fff;border:3px solid #000">'
  +ticks
  +'<polyline points="'+la+'" fill="none" stroke="#0000FF" stroke-width="4"/>'
  +'<polyline points="'+lm+'" fill="none" stroke="#FF0000" stroke-width="3"/>'
  +'<text x="'+x0+'" y="17" font-size="12" font-weight="900" fill="#0000FF">— 总资产（峰值 '+fmtM(maxA)+'）</text>'
  +'<text x="'+(x0+250)+'" y="17" font-size="12" font-weight="900" fill="#FF0000">— 心情</text>'
  +'</svg>';
}

/* ---- 自动托管 ---- */
function autoMonth(){const p=S.p;let g=0;while(p.ap>0&&g++<8)autoOne();endMonth();}
function autoOne(){const p=S.p;
 // 人生大事（自动决策，不耗行动点）
 if(canJob(p)){const list=eligibleOffers(p).filter(c=>c.id!==p.job);if(list.length){const c=list[0];p.job=c.id;p.jobLvl=0;p.yearsLvl=0;tl(p,'成为'+c.ladder[0].n);ach(p,'job');glog(p,'💼','（自动）你入职成为一名'+c.ladder[0].n+'。');}}
 if(!p.house&&p.age>=25&&assets(p)>=260000){houseBuy(0);}
 if(p.age>=20&&!p.flags.married&&!p.npcs.find(n=>n.type==='恋人')){const n=p.npcs.find(x=>['朋友','同学','同事'].includes(x.type)&&x.bond>=70);if(n){n.type='恋人';n.bond=78;tl(p,'和'+n.name+'在一起了');glog(p,'💗','（自动）你和'+n.name+'在一起了！');snd.up();}}
 if(p.age>=22&&!p.flags.married){const n=p.npcs.find(x=>x.type==='恋人'&&x.bond>=85);if(n&&p.job&&assets(p)>=20000){n.type='配偶';p.flags.married=true;mny(p,-20000);fameV(p,5);tl(p,'与'+n.name+'步入婚姻');ach(p,'marry');glog(p,'💍','（自动）你和'+n.name+'结婚了！');snd.up();}}
 if(p.flags.married&&!p.flags.child&&p.age>=25&&p.age<=40){const sp=p.npcs.find(x=>x.type==='配偶');if(sp){p.flags.child=true;addNPC(p,{name:pick(BABYNAMES),type:'子女',bond:90,ico:'👶'});sst(p,'mood',8);tl(p,'家里迎来了小宝宝');ach(p,'baby');glog(p,'👶','（自动）宝宝出生了，家里热闹起来！');snd.up();}}
 const acts=buildActions(p);const has=id=>acts.find(a=>a.id===id);
 if(p.npcs.length&&Math.random()<0.3){const n=pick(p.npcs);n.bond=clamp(n.bond+3,0,100);p.lastY[n.name]=p.age;glog(p,'💬','（自动）和'+n.name+'聊了聊天。');p.ap--;return;}
 let id=null;
 if(p.stats.mood<35&&has('fun'))id='fun';
 else if(p.stats.health<45&&has('rest'))id='rest';
 else{const st=stageOf(p.age);const pref=st==='child'?['study','play','hobby','family','rest']:st==='teen'?['study','exercise','hobby','family','rest']:['study','exercise','fun','rest','shopping'];
  for(const x of pref){if(has(x)){id=x;break;}}}
 if(!id){const a=acts[0];if(!a){p.ap=0;return;}id=a.id;}
 doActionCore(id,true);}
function fastYear(){if(S.over)return;const p=S.p;const a0=p.age;S.auto=true;let g=0;
 while(!S.over&&p.age<a0+1&&g++<60){autoAll();endMonth();}
 S.auto=false;if(!S.over)save();render();}
function autoAll(){const p=S.p;let g=0;while(p.ap>0&&g++<8)autoOne();}

 const gc={S:['#FF0000','#fff'],A:['#FFFF00','#000'],B:['#0000FF','#fff'],C:['#00FF00','#000']}[d.grade]||['#fff','#000'];

 +'<p class="dim">'+d.kindTxt+'</p><div class="grade" style="background:'+gc[0]+';color:'+gc[1]+'">'+d.grade+'</div>'
 +'<div class="kw">「'+d.kw+'」</div><p class="dim">综合评分 '+d.total+' / 100 · '+d.gradeName+'</p>'
 +'<div class="sumgrid">'
 +'<div class="card"><div class="dim">享年</div><div class="v">'+(p.age||'-')+' 岁</div></div>'

 +'<div class="card"><div class="dim">总资产</div><div class="v">'+fmtM(d.as||0)+'</div></div>'

 +(p.ach&&p.ach.length?'<div class="card" style="text-align:left"><h3>🏆 成就（'+p.ach.length+'）</h3>'+p.ach.map(id=>'<span class="ach-chip">🎖️ '+ACHV[id].n+' · '+ACHV[id].d+'</span>').join('')+'</div>':'')
 +'<div class="card" style="text-align:left;margin-top:12px"><h3>🕰️ 人生时间线</h3>'+(p.timeline||[]).map(t=>'<div class="tl-item"><b>'+t.age+'岁</b>'+t.t+'</div>').join('')+'</div>'
 +'<div style="margin:26px 0 40px"><button class="btn primary" style="font-size:17px;padding:13px 36px" onclick="restart()">🌱 再来一段新人生</button></div></div>';}
